services:
  - type: web
    name: ndolos-site
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
      - key: BASE_URL
        value: https://ndolos.site
      - key: BRAND_NAME
        value: Ndolo Invitations
      - key: BUSINESS_WHATSAPP
        value: "237657664546"
      - key: BUSINESS_EMAIL
        value: contact@ndolos.site
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: CLOUDINARY_URL
        sync: false
