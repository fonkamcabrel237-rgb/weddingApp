app = "ndolos-site"
primary_region = "cdg"

[build]

[env]
  PORT = "3000"
  NODE_ENV = "production"
  DATA_DIR = "/app/data"
  BASE_URL = "https://ndolos.site"
  BRAND_NAME = "Ndolo Invitations"
  BUSINESS_WHATSAPP = "237657664546"
  BUSINESS_EMAIL = "contact@ndolos.site"
  ADMIN_PASSWORD = "change-moi"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "ndolo_data"
  destination = "/app/data"
  initial_size = "1gb"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
